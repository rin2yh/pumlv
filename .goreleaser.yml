version: 2

project_name: pumlv

before:
  hooks:
    - go mod download

builds:
  - id: pumlv
    main: .
    binary: pumlv
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/rin2yh/pumlv/version.Version={{ .Version }}
      - -X github.com/rin2yh/pumlv/version.Revision={{ .ShortCommit }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: pumlv
    ids:
      - pumlv
    name_template: 'pumlv_v{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - CREDITS
      - CREDITS-vendored
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ .Version }}-next'

changelog:
  disable: true

release:
  use_existing_draft: true
  draft: false
  prerelease: auto
