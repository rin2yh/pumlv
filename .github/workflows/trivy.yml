name: Trivy

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/frontend/package.json'
      - 'internal/frontend/pnpm-lock.yaml'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/frontend/package.json'
      - 'internal/frontend/pnpm-lock.yaml'
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Filesystem scan (vuln + license)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy license scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: '1'
