name: Release recommendation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/circe.yml'
      - '.github/workflows/actions.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recommend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recommend a release
        id: circe
        uses: rin2yh/circe@main
