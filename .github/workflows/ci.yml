name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'server/**'
      - 'static/**'
      - 'version/**'
      - 'frontend/**'
      - 'examples/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.octocov.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-frontend/**'
  pull_request:
    paths:
      - 'cmd/**'
      - 'server/**'
      - 'static/**'
      - 'version/**'
      - 'frontend/**'
      - 'examples/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.octocov.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-frontend/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-frontend

      - name: Generate (frontend build for //go:embed)
        run: make generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: make lint-backend

      - name: Test
        run: make test-backend

      - name: Run octocov
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-frontend

      - name: Lint
        run: make lint-frontend

      - name: Test
        run: make test-frontend

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-frontend

      - name: Build
        run: make build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chrome
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chrome

      - name: E2E tests
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
