name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'version/**'
      - 'examples/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.golangci-lint-version'
      - '.octocov.yml'
      - '.github/workflows/**'
      - '.github/actions/setup-frontend/**'
      - '.github/actions/setup-playwright/**'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'version/**'
      - 'examples/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.golangci-lint-version'
      - '.octocov.yml'
      - '.github/workflows/**'
      - '.github/actions/setup-frontend/**'
      - '.github/actions/setup-playwright/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-generated-files:
    name: Check generated files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: $/.github/actions/setup-frontend

      - name: Generate
        run: make generate

      - name: Check generated files are up to date
        run: git diff --exit-code

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true

      - uses: $/.github/actions/setup-frontend

      - name: Generate (frontend build for //go:embed)
        run: make generate

      - name: Lint
        run: make lint-backend

      - name: Test
        run: make test-backend

      - name: Run octocov
        uses: k1LoW/octocov-action@v1.5.2

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: $/.github/actions/setup-frontend

      - name: Install frontend dependencies
        working-directory: internal/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: internal/frontend
        run: pnpm run build

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o pumlv.exe .

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-frontend

      - name: Lint
        run: make lint-frontend

      - uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium chromium-headless-shell

      - name: Unit tests
        run: make test-frontend-unit

      - name: Integration tests
        run: make test-frontend-integration

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: $/.github/actions/setup-frontend

      - name: Build
        run: make build

      - uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium chromium-headless-shell

      - name: E2E tests
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            internal/frontend/playwright-report/
            internal/frontend/test-results/
          retention-days: 7
