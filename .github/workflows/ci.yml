name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'version/**'
      - 'examples/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.octocov.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-frontend/**'
      - '.github/actions/setup-playwright/**'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'version/**'
      - 'examples/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.octocov.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-frontend/**'
      - '.github/actions/setup-playwright/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-frontend

      - name: Generate (frontend build for //go:embed)
        run: make generate

      - name: Lint
        run: make lint-backend

      - name: Test
        run: make test-backend

      - name: Run octocov
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Lint
        run: make lint-frontend

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium chromium-headless-shell

      - name: Unit tests
        run: make test-frontend-unit

      - name: Integration tests
        run: make test-frontend-integration

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-frontend

      - name: Build
        run: make build

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium chromium-headless-shell

      - name: E2E tests
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            internal/frontend/playwright-report/
            internal/frontend/test-results/
          retention-days: 7
