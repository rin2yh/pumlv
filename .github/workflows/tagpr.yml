name: tagpr

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize runs so concurrent pushes don't race the git data API (401).
    concurrency:
      group: tagpr-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: $/.github/actions/setup-frontend

      - id: tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # tagpr tags this run's release-branch HEAD, so $/ resolves to the same source as the checked-out tag.
      - uses: $/.github/actions/setup-frontend

      - name: Generate (frontend build for //go:embed)
        run: make generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
