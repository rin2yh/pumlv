name: Setup frontend toolchain
description: Install pnpm (from packageManager field) and Node.js with pnpm store cache.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.0.8
      with:
        package_json_file: internal/frontend/package.json

    - uses: actions/setup-node@v6.4.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: internal/frontend/pnpm-lock.yaml
